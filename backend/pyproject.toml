[project]
name = "reqengine-backend"
version = "0.1.0"
description = "ReqEngine backend — requirements management API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0,<0.137",
    "uvicorn[standard]>=0.34.0,<0.35",
    "sqlalchemy>=2.0.49,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.18.4,<1.19",
    "redis>=5.3.0,<6",
    "pydantic>=2.11.0,<3",
    "pydantic-settings>=2.9.0,<3",
    "bleach>=6.3.0,<7",
    "python-dotenv>=1.1.0,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
tests = [
    "robotframework>=7.2.2,<8",
    "robotframework-requests>=0.9.7",
]

[tool.uv]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
